<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFriend synthetic Realtime harness</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      body {
        background: #11100e;
        color: #f3eee6;
        margin: 0 auto;
        max-width: 52rem;
        padding: 2rem;
      }

      button {
        background: #e9c99b;
        border: 0;
        border-radius: 999px;
        color: #20170f;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0.8rem 1.2rem;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      pre {
        background: #1b1916;
        border: 1px solid #37312a;
        border-radius: 0.75rem;
        min-height: 12rem;
        overflow: auto;
        padding: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Synthetic Realtime acceptance harness</h1>
    <p>
      This local-only harness bypasses hardware capture. It still uses the real
      dev client-secret route through a local proxy, Agents SDK, WebRTC
      transport, model, transcripts, interruption, and cleanup.
    </p>
    <button id="start" type="button">Run synthetic conversation</button>
    <p id="status" role="status">Ready.</p>
    <pre id="output" aria-label="Harness evidence"></pre>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
