packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.2.12"
  - "@next/eslint-plugin-next@16.2.12"
  - "@next/swc-darwin-arm64@16.2.12"
  - "@next/swc-darwin-x64@16.2.12"
  - "@next/swc-linux-arm64-gnu@16.2.12"
  - "@next/swc-linux-arm64-musl@16.2.12"
  - "@next/swc-linux-x64-gnu@16.2.12"
  - "@next/swc-linux-x64-musl@16.2.12"
  - "@next/swc-win32-arm64-msvc@16.2.12"
  - "@next/swc-win32-x64-msvc@16.2.12"
  - eslint-config-next@16.2.12
  - next@16.2.12

onlyBuiltDependencies:
  - sharp

# Temporary transitive security floors. Remove an override when its parent
# dependency ships an equivalent or newer safe version.
overrides:
  "@hono/node-server@<2.0.10": 2.0.12
  "minimatch@3.1.5>brace-expansion": 5.0.8
  postcss@<=8.5.17: 8.5.23
  sharp@<0.35.0: 0.35.3

# minimatch 3 expects brace-expansion's legacy callable CommonJS export. This
# adapter accepts the patched v5 named export until the ESLint toolchain moves
# to a compatible minimatch. Remove the patch and override together.
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
