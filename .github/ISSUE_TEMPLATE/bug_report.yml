name: Bug report
description: Report behavior that breaks an OpenFriend user story.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping make OpenFriend more trustworthy.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Who is affected, what were they trying to do, and why?
      placeholder: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What observable result should have occurred?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Include relevant device, browser, command output, or logs without secrets.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that helps, including privacy or reliability impact.
    validations:
      required: false
